## Hermes stack entry point: Hermes agent + Obsidian sync.
## Add this file (not compose.hermes.services.yml) to COMPOSE_FILE in .env.
## It exists only so the stack interpolates ${...} from its own .env.hermes:
## `include` is the only way to give a file a second env file, since Compose
## ignores COMPOSE_ENV_FILES when it is set in .env.
## The services themselves live in compose.hermes.services.yml.
include:
  - path: compose.hermes.services.yml
    env_file: .env.hermes
