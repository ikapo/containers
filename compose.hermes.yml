services:
  hermes:
    image: nousresearch/hermes-agent
    network_mode: host
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_DASHBOARD: '1'
      PUID: 1000
      PGID: 1000
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: '${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}'
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: '${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}'
      ICLOUD_EMAIL: '${ICLOUD_EMAIL}'
      ICLOUD_PASSWORD: '${ICLOUD_PASSWORD}'
      HEVY_API_KEY: '${HEVY_API_KEY}'
      OBSIDIAN_VAULT_PATH: '/obsidian'
      HERMES_WRITE_SAFE_ROOT: '/opt/data:/obsidian'
      TZ: '${TZ}'
    # ports:
    #   - "8642:8642"
    #   - "9119:9119"
    #   - "127.0.0.1:43827:43827"
    volumes:
      - ./configs/hermes:/opt/data
      - ./obsidian/vault:/obsidian

  # hermes-webui:
  #   image: ghcr.io/nesquena/hermes-webui:latest
  #   container_name: hermes-webui
  #   restart: unless-stopped
  #   depends_on:
  #     - hermes
  #   ports:
  #     - "8787:8787"
  #   environment:
  #     UID: 1000
  #     GID: 1000
  #     PUID: 1000
  #     PGID: 1000
  #     HERMES_UID: 1000
  #     HERMES_GID: 1000
  #     HERMES_WEBUI_HOST: '0.0.0.0'
  #     HERMES_WEBUI_PASSWORD: '${HERMES_WEBUI_PASSWORD}'
  #     HERMES_WEBUI_STATE_DIR: '/home/hermeswebui/.hermes/webui'
  #     #HERMES_DASHBOARD_BASIC_AUTH_SECRET: 'ikapo'
  #     TZ: '${TZ}'
  #   volumes:
  #     # Same Hermes home as the agent container
  #     - ./configs/hermes:/home/hermeswebui/.hermes

  obsidian-sync:
    image: ghcr.io/${GHCR_REPO:-belphemur/obsidian-headless-sync-docker}:latest
    container_name: obsidian-sync
    environment:
      # Required
      OBSIDIAN_AUTH_TOKEN: '${OBSIDIAN_AUTH_TOKEN}'
      VAULT_NAME: '${VAULT_NAME}'
      # Required if vault uses end-to-end encryption
      VAULT_PASSWORD: '${VAULT_PASSWORD:-}'
      # File ownership: UID:GID of the host user who should own vault files.
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
    volumes:
      - ${VAULT_HOST_PATH:-./vault}:/vault
      - ${CONFIG_HOST_PATH:-./config}:/home/obsidian/.config
    restart: unless-stopped
